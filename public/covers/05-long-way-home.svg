<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="回家的长路 — 占位封面">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E5C86"/>
      <stop offset="1" stop-color="#C9D6E4"/>
    </linearGradient>
    <filter id="n4" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <pattern id="dots4" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#171717" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#g4)"/>
  <g>
    <circle cx="66" cy="566" r="403" fill="#3E5C86" opacity="0.72"/>
    <circle cx="477" cy="881" r="184" fill="none" stroke="#C9D6E4" stroke-width="8" opacity="0.50"/>
    <circle cx="477" cy="881" r="287" fill="none" stroke="#C9D6E4" stroke-width="6" opacity="0.38"/>
    <circle cx="477" cy="881" r="389" fill="none" stroke="#C9D6E4" stroke-width="4" opacity="0.26"/>
    <g transform="rotate(-13.7 512 512)" opacity="0.16"><rect x="-256" y="412.0304060436785" width="1536" height="24" fill="#171717"/></g>
    <g transform="rotate(21.9 512 512)" opacity="0.1"><rect x="-256" y="358.4314454562962" width="1536" height="21" fill="#171717"/></g>
    <circle cx="183" cy="656" r="4.7" fill="#171717" opacity="0.22"/>
    <circle cx="406" cy="505" r="5.9" fill="#171717" opacity="0.22"/>
    <circle cx="157" cy="884" r="2.6" fill="#171717" opacity="0.22"/>
    <circle cx="133" cy="963" r="6.8" fill="#171717" opacity="0.22"/>
    <circle cx="365" cy="835" r="6.6" fill="#171717" opacity="0.22"/>
    <circle cx="430" cy="326" r="4.1" fill="#171717" opacity="0.22"/>
    <circle cx="170" cy="160" r="3.4" fill="#171717" opacity="0.22"/>
    <circle cx="769" cy="742" r="2.7" fill="#171717" opacity="0.22"/>
    <circle cx="64" cy="181" r="5.1" fill="#171717" opacity="0.22"/>
    <circle cx="447" cy="274" r="3.6" fill="#171717" opacity="0.22"/>
    <circle cx="519" cy="37" r="6.1" fill="#171717" opacity="0.22"/>
    <circle cx="612" cy="950" r="4.5" fill="#171717" opacity="0.22"/>
    <circle cx="497" cy="386" r="4.1" fill="#171717" opacity="0.22"/>
    <circle cx="970" cy="592" r="2.2" fill="#171717" opacity="0.22"/>
  </g>
  <rect width="1024" height="1024" fill="url(#dots4)"/>
  <rect width="1024" height="1024" filter="url(#n4)" opacity="0.6"/>

  <!-- 上下压暗，加深色文字可读 -->
  <rect width="1024" height="1024" fill="url(#vig4)" opacity="0"/>
  <rect y="694" width="1024" height="330" fill="#171717" opacity="0.62"/>
  <rect width="1024" height="150" fill="#171717" opacity="0.5"/>

  <!-- 序号 -->
  <text x="64" y="112" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" letter-spacing="-2">05</text>

  <!-- 占位标记 -->
  <g transform="translate(724 62)">
    <rect x="0" y="0" width="236" height="46" rx="23" fill="#feece3" opacity="0.92"/>
    <text x="118" y="30" text-anchor="middle" fill="#171717"
          font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="19" font-weight="800"
          letter-spacing="1.4">占位封面 PLACEHOLDER</text>
  </g>

  <!-- 标题与分类 -->
  <text x="64" y="838" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2.4">回家的长路</text>
  <text x="66" y="884" fill="#feece3" opacity="0.78"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="24" font-weight="700"
        letter-spacing="3.6">短片</text>
  <text x="64" y="946" fill="#feece3" opacity="0.66"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="21" font-weight="500"
        letter-spacing="0.4">一段夜路上的行车影像，把路程本身当成内容。</text>
</svg>
