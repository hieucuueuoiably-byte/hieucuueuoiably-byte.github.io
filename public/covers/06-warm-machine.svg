<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="温热的机器 — 占位封面">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E08A5C"/>
      <stop offset="1" stop-color="#F6E3D0"/>
    </linearGradient>
    <filter id="n5" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <pattern id="dots5" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#171717" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#g5)"/>
  <g>
    <circle cx="739" cy="464" r="367" fill="#E08A5C" opacity="0.72"/>
    <circle cx="973" cy="623" r="184" fill="none" stroke="#F6E3D0" stroke-width="8" opacity="0.50"/>
    <circle cx="973" cy="623" r="287" fill="none" stroke="#F6E3D0" stroke-width="6" opacity="0.38"/>
    <circle cx="973" cy="623" r="389" fill="none" stroke="#F6E3D0" stroke-width="4" opacity="0.26"/>
    <g transform="rotate(-14.1 512 512)" opacity="0.16"><rect x="-256" y="564.3235884051769" width="1536" height="30" fill="#171717"/></g>
    <g transform="rotate(22.6 512 512)" opacity="0.1"><rect x="-256" y="621.4852746307849" width="1536" height="11" fill="#171717"/></g>
    <circle cx="554" cy="760" r="4.1" fill="#171717" opacity="0.22"/>
    <circle cx="635" cy="721" r="6.6" fill="#171717" opacity="0.22"/>
    <circle cx="391" cy="322" r="3.1" fill="#171717" opacity="0.22"/>
    <circle cx="855" cy="430" r="3.5" fill="#171717" opacity="0.22"/>
    <circle cx="625" cy="189" r="5.9" fill="#171717" opacity="0.22"/>
    <circle cx="70" cy="570" r="3.5" fill="#171717" opacity="0.22"/>
    <circle cx="507" cy="274" r="5.5" fill="#171717" opacity="0.22"/>
    <circle cx="506" cy="596" r="5.5" fill="#171717" opacity="0.22"/>
    <circle cx="420" cy="246" r="6.3" fill="#171717" opacity="0.22"/>
    <circle cx="373" cy="251" r="5.1" fill="#171717" opacity="0.22"/>
    <circle cx="35" cy="186" r="7.0" fill="#171717" opacity="0.22"/>
    <circle cx="762" cy="775" r="4.2" fill="#171717" opacity="0.22"/>
    <circle cx="535" cy="122" r="4.4" fill="#171717" opacity="0.22"/>
    <circle cx="1004" cy="157" r="2.3" fill="#171717" opacity="0.22"/>
  </g>
  <rect width="1024" height="1024" fill="url(#dots5)"/>
  <rect width="1024" height="1024" filter="url(#n5)" opacity="0.6"/>

  <!-- 上下压暗，加深色文字可读 -->
  <rect width="1024" height="1024" fill="url(#vig5)" opacity="0"/>
  <rect y="694" width="1024" height="330" fill="#171717" opacity="0.62"/>
  <rect width="1024" height="150" fill="#171717" opacity="0.5"/>

  <!-- 序号 -->
  <text x="64" y="112" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" letter-spacing="-2">06</text>

  <!-- 占位标记 -->
  <g transform="translate(724 62)">
    <rect x="0" y="0" width="236" height="46" rx="23" fill="#feece3" opacity="0.92"/>
    <text x="118" y="30" text-anchor="middle" fill="#171717"
          font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="19" font-weight="800"
          letter-spacing="1.4">占位封面 PLACEHOLDER</text>
  </g>

  <!-- 标题与分类 -->
  <text x="64" y="838" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2.4">温热的机器</text>
  <text x="66" y="884" fill="#feece3" opacity="0.78"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="24" font-weight="700"
        letter-spacing="3.6">动画</text>
  <text x="64" y="946" fill="#feece3" opacity="0.66"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="21" font-weight="500"
        letter-spacing="0.4">一台不知疲倦的机器，做着没什么用的温柔工作。</text>
</svg>
