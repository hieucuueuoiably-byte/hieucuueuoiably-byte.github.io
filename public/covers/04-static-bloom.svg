<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="噪点开花 — 占位封面">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9A7E0"/>
      <stop offset="1" stop-color="#3F3A55"/>
    </linearGradient>
    <filter id="n3" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <pattern id="dots3" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#171717" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#g3)"/>
  <g>
    <circle cx="1022" cy="782" r="471" fill="#B9A7E0" opacity="0.72"/>
    <circle cx="970" cy="298" r="184" fill="none" stroke="#3F3A55" stroke-width="8" opacity="0.50"/>
    <circle cx="970" cy="298" r="287" fill="none" stroke="#3F3A55" stroke-width="6" opacity="0.38"/>
    <circle cx="970" cy="298" r="389" fill="none" stroke="#3F3A55" stroke-width="4" opacity="0.26"/>
    <g transform="rotate(1.9 512 512)" opacity="0.16"><rect x="-256" y="431.12761982567605" width="1536" height="19" fill="#171717"/></g>
    <g transform="rotate(-3.0 512 512)" opacity="0.1"><rect x="-256" y="575.1329387269914" width="1536" height="8" fill="#171717"/></g>
    <circle cx="485" cy="371" r="4.5" fill="#171717" opacity="0.22"/>
    <circle cx="175" cy="155" r="2.3" fill="#171717" opacity="0.22"/>
    <circle cx="182" cy="615" r="3.5" fill="#171717" opacity="0.22"/>
    <circle cx="258" cy="673" r="3.4" fill="#171717" opacity="0.22"/>
    <circle cx="906" cy="205" r="6.2" fill="#171717" opacity="0.22"/>
    <circle cx="490" cy="18" r="5.5" fill="#171717" opacity="0.22"/>
    <circle cx="968" cy="768" r="3.6" fill="#171717" opacity="0.22"/>
    <circle cx="394" cy="448" r="3.7" fill="#171717" opacity="0.22"/>
    <circle cx="781" cy="843" r="3.4" fill="#171717" opacity="0.22"/>
    <circle cx="429" cy="932" r="6.5" fill="#171717" opacity="0.22"/>
    <circle cx="790" cy="776" r="6.9" fill="#171717" opacity="0.22"/>
    <circle cx="673" cy="506" r="5.9" fill="#171717" opacity="0.22"/>
    <circle cx="937" cy="96" r="5.9" fill="#171717" opacity="0.22"/>
    <circle cx="361" cy="829" r="2.1" fill="#171717" opacity="0.22"/>
  </g>
  <rect width="1024" height="1024" fill="url(#dots3)"/>
  <rect width="1024" height="1024" filter="url(#n3)" opacity="0.6"/>

  <!-- 上下压暗，加深色文字可读 -->
  <rect width="1024" height="1024" fill="url(#vig3)" opacity="0"/>
  <rect y="694" width="1024" height="330" fill="#171717" opacity="0.62"/>
  <rect width="1024" height="150" fill="#171717" opacity="0.5"/>

  <!-- 序号 -->
  <text x="64" y="112" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" letter-spacing="-2">04</text>

  <!-- 占位标记 -->
  <g transform="translate(724 62)">
    <rect x="0" y="0" width="236" height="46" rx="23" fill="#feece3" opacity="0.92"/>
    <text x="118" y="30" text-anchor="middle" fill="#171717"
          font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="19" font-weight="800"
          letter-spacing="1.4">占位封面 PLACEHOLDER</text>
  </g>

  <!-- 标题与分类 -->
  <text x="64" y="838" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2.4">噪点开花</text>
  <text x="66" y="884" fill="#feece3" opacity="0.78"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="24" font-weight="700"
        letter-spacing="3.6">实验影像</text>
  <text x="64" y="946" fill="#feece3" opacity="0.66"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="21" font-weight="500"
        letter-spacing="0.4">把噪点当成种子，看它在画面里长出结构。</text>
</svg>
