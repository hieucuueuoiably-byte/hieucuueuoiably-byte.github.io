<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="盐的尽头 — 占位封面">
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D9C3"/>
      <stop offset="1" stop-color="#7F9BB5"/>
    </linearGradient>
    <filter id="n0" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <pattern id="dots0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#171717" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#g0)"/>
  <g>
    <circle cx="607" cy="938" r="484" fill="#E9D9C3" opacity="0.72"/>
    <circle cx="755" cy="540" r="184" fill="none" stroke="#7F9BB5" stroke-width="8" opacity="0.50"/>
    <circle cx="755" cy="540" r="287" fill="none" stroke="#7F9BB5" stroke-width="6" opacity="0.38"/>
    <circle cx="755" cy="540" r="389" fill="none" stroke="#7F9BB5" stroke-width="4" opacity="0.26"/>
    <g transform="rotate(10.3 512 512)" opacity="0.16"><rect x="-256" y="639.4782682005316" width="1536" height="19" fill="#171717"/></g>
    <g transform="rotate(-16.5 512 512)" opacity="0.1"><rect x="-256" y="354.1930279836059" width="1536" height="20" fill="#171717"/></g>
    <circle cx="293" cy="834" r="5.1" fill="#171717" opacity="0.22"/>
    <circle cx="591" cy="115" r="5.7" fill="#171717" opacity="0.22"/>
    <circle cx="862" cy="650" r="2.8" fill="#171717" opacity="0.22"/>
    <circle cx="864" cy="982" r="3.9" fill="#171717" opacity="0.22"/>
    <circle cx="1002" cy="853" r="7.0" fill="#171717" opacity="0.22"/>
    <circle cx="196" cy="769" r="6.0" fill="#171717" opacity="0.22"/>
    <circle cx="34" cy="515" r="5.6" fill="#171717" opacity="0.22"/>
    <circle cx="37" cy="130" r="4.4" fill="#171717" opacity="0.22"/>
    <circle cx="481" cy="498" r="3.9" fill="#171717" opacity="0.22"/>
    <circle cx="724" cy="1018" r="4.0" fill="#171717" opacity="0.22"/>
    <circle cx="771" cy="503" r="5.9" fill="#171717" opacity="0.22"/>
    <circle cx="934" cy="160" r="4.3" fill="#171717" opacity="0.22"/>
    <circle cx="43" cy="213" r="5.5" fill="#171717" opacity="0.22"/>
    <circle cx="726" cy="556" r="5.2" fill="#171717" opacity="0.22"/>
  </g>
  <rect width="1024" height="1024" fill="url(#dots0)"/>
  <rect width="1024" height="1024" filter="url(#n0)" opacity="0.6"/>

  <!-- 上下压暗，加深色文字可读 -->
  <rect width="1024" height="1024" fill="url(#vig0)" opacity="0"/>
  <rect y="694" width="1024" height="330" fill="#171717" opacity="0.62"/>
  <rect width="1024" height="150" fill="#171717" opacity="0.5"/>

  <!-- 序号 -->
  <text x="64" y="112" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" letter-spacing="-2">01</text>

  <!-- 占位标记 -->
  <g transform="translate(724 62)">
    <rect x="0" y="0" width="236" height="46" rx="23" fill="#feece3" opacity="0.92"/>
    <text x="118" y="30" text-anchor="middle" fill="#171717"
          font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="19" font-weight="800"
          letter-spacing="1.4">占位封面 PLACEHOLDER</text>
  </g>

  <!-- 标题与分类 -->
  <text x="64" y="838" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2.4">盐的尽头</text>
  <text x="66" y="884" fill="#feece3" opacity="0.78"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="24" font-weight="700"
        letter-spacing="3.6">AI 短片</text>
  <text x="64" y="946" fill="#feece3" opacity="0.66"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="21" font-weight="500"
        letter-spacing="0.4">一段关于退潮之后留在盐壳上的痕迹的凝滞影像。</text>
</svg>
