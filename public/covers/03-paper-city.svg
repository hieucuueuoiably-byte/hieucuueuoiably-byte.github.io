<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="纸的城市 — 占位封面">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FB79A"/>
      <stop offset="1" stop-color="#F2E4C9"/>
    </linearGradient>
    <filter id="n2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <pattern id="dots2" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#171717" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#g2)"/>
  <g>
    <circle cx="637" cy="817" r="443" fill="#8FB79A" opacity="0.72"/>
    <circle cx="831" cy="968" r="184" fill="none" stroke="#F2E4C9" stroke-width="8" opacity="0.50"/>
    <circle cx="831" cy="968" r="287" fill="none" stroke="#F2E4C9" stroke-width="6" opacity="0.38"/>
    <circle cx="831" cy="968" r="389" fill="none" stroke="#F2E4C9" stroke-width="4" opacity="0.26"/>
    <g transform="rotate(10.6 512 512)" opacity="0.16"><rect x="-256" y="644.1869309559464" width="1536" height="28" fill="#171717"/></g>
    <g transform="rotate(-17.0 512 512)" opacity="0.1"><rect x="-256" y="495.5248693332076" width="1536" height="17" fill="#171717"/></g>
    <circle cx="676" cy="984" r="5.8" fill="#171717" opacity="0.22"/>
    <circle cx="629" cy="744" r="3.7" fill="#171717" opacity="0.22"/>
    <circle cx="507" cy="816" r="5.0" fill="#171717" opacity="0.22"/>
    <circle cx="527" cy="572" r="2.3" fill="#171717" opacity="0.22"/>
    <circle cx="582" cy="528" r="4.3" fill="#171717" opacity="0.22"/>
    <circle cx="208" cy="440" r="4.0" fill="#171717" opacity="0.22"/>
    <circle cx="49" cy="0" r="4.7" fill="#171717" opacity="0.22"/>
    <circle cx="659" cy="252" r="2.0" fill="#171717" opacity="0.22"/>
    <circle cx="938" cy="921" r="6.4" fill="#171717" opacity="0.22"/>
    <circle cx="93" cy="855" r="6.9" fill="#171717" opacity="0.22"/>
    <circle cx="200" cy="968" r="4.5" fill="#171717" opacity="0.22"/>
    <circle cx="350" cy="404" r="5.8" fill="#171717" opacity="0.22"/>
    <circle cx="598" cy="166" r="2.2" fill="#171717" opacity="0.22"/>
    <circle cx="505" cy="770" r="4.5" fill="#171717" opacity="0.22"/>
  </g>
  <rect width="1024" height="1024" fill="url(#dots2)"/>
  <rect width="1024" height="1024" filter="url(#n2)" opacity="0.6"/>

  <!-- 上下压暗，加深色文字可读 -->
  <rect width="1024" height="1024" fill="url(#vig2)" opacity="0"/>
  <rect y="694" width="1024" height="330" fill="#171717" opacity="0.62"/>
  <rect width="1024" height="150" fill="#171717" opacity="0.5"/>

  <!-- 序号 -->
  <text x="64" y="112" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="62" font-weight="800" letter-spacing="-2">03</text>

  <!-- 占位标记 -->
  <g transform="translate(724 62)">
    <rect x="0" y="0" width="236" height="46" rx="23" fill="#feece3" opacity="0.92"/>
    <text x="118" y="30" text-anchor="middle" fill="#171717"
          font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="19" font-weight="800"
          letter-spacing="1.4">占位封面 PLACEHOLDER</text>
  </g>

  <!-- 标题与分类 -->
  <text x="64" y="838" fill="#feece3" font-family="'Libre Franklin',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="800" letter-spacing="-2.4">纸的城市</text>
  <text x="66" y="884" fill="#feece3" opacity="0.78"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="24" font-weight="700"
        letter-spacing="3.6">AI 影像</text>
  <text x="64" y="946" fill="#feece3" opacity="0.66"
        font-family="'Libre Franklin',Helvetica,Arial,sans-serif" font-size="21" font-weight="500"
        letter-spacing="0.4">像纸模型一样被搭起来、又被风推歪的街区。</text>
</svg>
